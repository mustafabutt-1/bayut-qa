[pytest]
# Module identity comes from each file's own path, not a package-walk dotted name —
# needed because tests/suites/ is organized as numbered, checklist-section folders
# (04_sign_in_up, 05_leads, ...), and pytest's default "prepend" import mode treats a
# leading-digit directory name as a sys.path insertion boundary. Two same-named
# "consequential/" subpackages under different numbered parents then collide under the
# same short module name once collected together — confirmed live, first surfaced only
# when running the whole suite in one invocation (docs/DECISIONS.md D-029).
addopts = --import-mode=importlib
